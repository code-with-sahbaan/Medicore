<div class="card flex p-4">
  <p-drawer #drawerRef [(visible)]="visible" [dismissible]="!isDesktop" [closeOnEscape]="!isDesktop"
    [modal]="!isDesktop" position="left" [style]="{ width: '300px' }" [blockScroll]="!isDesktop">
    <ng-template #headless>
      <div class="flex flex-col h-full p-4">
        <div class="flex items-center justify-between px-4 pt-4 pb-6 shrink-0">
          <img src="https://res.cloudinary.com/dyrbo1wml/image/upload/v1750841014/Logo_ofqiag.png" width="150"
            alt="Logo" class="cursor-pointer" [routerLink]="['/doctor/home']" />
        </div>
        <ul class="list-none p-2 m-0 overflow-hidden">
          @for (item of menuItems; track item.label) {
          <li>
            <a pRipple
              class="flex items-center cursor-pointer p-3 mb-4 rounded-border text-surface-700 dark:text-surface-100 hover:bg-surface-100 dark:hover:bg-surface-700 duration-150 transition-colors {{currentUrl == item.route ? 'selected-menu font-bold text-primary': 'text-primary-900'}}"
              [routerLink]="item.route">
              <i class="{{ item.icon }} mr-2"></i>
              <span class="font-medium">{{ item.label }}</span>
            </a>
          </li>
          }
          <li>
            <a pRipple [routerLink]="'/doctor/userProfile'"
              class="flex items-center cursor-pointer p-3 mb-4 gap-4 rounded-border text-surface-700 dark:text-surface-100 hover:bg-surface-100 dark:hover:bg-surface-700 duration-150 transition-colors">
              <p-avatar label="{{fullName[0].toUpperCase()}}" shape="circle" />
               <span class="font-bold">{{fullName.toUpperCase()}}</span>
            </a>
          </li>
        </ul>
      </div>
    </ng-template>
  </p-drawer>
  <div class="transition-all duration-300 w-screen" [ngStyle]="{ 'padding-left.px': isDesktop ? 300 : 0 }">
    <!-- Topbar: Only shown on mobile/tablet -->
    @if (!isDesktop){
    <div class="p-4">
      <p-button icon="pi pi-bars" (click)="toggleDrawer()"></p-button>
    </div>
    }
    <div class="p-4">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
