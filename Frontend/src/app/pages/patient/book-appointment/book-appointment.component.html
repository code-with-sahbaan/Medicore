<div>
    <div id="header" class="pb-7 grid grid-nogutter justify-between">
        <div class="col-12 md:col-6">
            <h2 class="text-800 text-primary-900 text-4xl font-semibold">
                Book Appointment
            </h2>
        </div>
    </div>

    <div class="card">
        <p-table [value]="consultants" [lazy]="true" (onLazyLoad)="getAllActiveConsultants($event)" [paginator]="true" [rows]="size" [first]="first"
            [totalRecords]="rows" [sortField]="sort" [sortOrder]="order"
            [tableStyle]="{ 'min-width': '50rem' }"
            [showCurrentPageReport]="true"
            currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
            [rowsPerPageOptions]="[10, 25, 50]">
            <ng-template #header>
                <tr>
                    <th pSortableColumn="fullName" style="width:25%">
                        <div class="flex items-center gap-2">
                            Name
                            <p-sortIcon field="fullName" />
                        </div>
                    </th>
                    <th style="width:25%">Email</th>
                    <th style="width:25%">Action</th>
                </tr>
            </ng-template>
            <ng-template #body let-consultants>
                <tr>
                    <td>{{ consultants.fullName }}</td>
                    <td>{{ consultants.email }}</td>
                    <td><p-button variant="text">Book Consultation</p-button></td>
                </tr>
            </ng-template>
            <ng-template #paginatorright />
        </p-table>
    </div>
</div>
