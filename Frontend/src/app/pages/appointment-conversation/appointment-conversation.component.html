<div class="h-screen grid grid-nogutter p-4 gap-2 justify-between">
  <div class="col-12 h-screen mb-3" style="position: relative; ">
    <div style="position: absolute; z-index: 5; background-color: black; top: 0; left: 0; border-radius: 40px;"
      class="w-full h-full">
      <video [hidden]="!webRtc.remoteCallActive" #remoteVideo autoplay playsinline class="remote-video w-full h-full"></video>
    </div>
    <div
      style="position: absolute; z-index: 10; background-color: blue; width: 250px; height: 250px; top: 0; right: 0; margin-top: 20px; margin-right: 20px; border-radius: 40px;">
      <video #localVideo autoplay playsinline muted class="local-video"></video>
    </div>
    <div style="position: absolute; bottom: 10%;z-index: 15; width: 100%;" class="grid grid-nogutter justify-center gap-2">
      <p-button severity="contrast" (click)="updateVideo()">{{videoText}}</p-button>
      <p-button severity="primary" *ngIf="!isCallJoined" [disabled]="isCallJoined" (click)="startCall()">Join
        Call</p-button>
      <p-button severity="danger" *ngIf="isCallJoined" (click)="hangup()">Hang Up</p-button>
      <p-button severity="contrast" (click)="updateAudio()">{{audioText}}</p-button>
    </div>
  </div>
  <div class="col-12">
    <div class="h-full w-full">
      <p-editor [readonly]="!isDoctor" (onTextChange)="textChange($event)" placeholder="Write your prescription here.." [(ngModel)]="webRtc.prescription" [style]="{ height: '81vh' }">
        <ng-template #header>
          <span class="ql-formats">
            <p class="text-800 text-primary-900 text-4xl font-semibold mb-3">Prescription</p>
            <button type="button" class="ql-bold" aria-label="Bold"></button>
            <button type="button" class="ql-italic" aria-label="Italic"></button>
            <button type="button" class="ql-underline" aria-label="Underline"></button>
          </span>
        </ng-template>
      </p-editor>
    </div>
  </div>
</div>
