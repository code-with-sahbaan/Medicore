<div class="h-screen grid grid-nogutter p-4 gap-2 justify-between">
  <div class="col-7" style="position: relative; ">
    <div style="position: absolute; z-index: 5; background-color: black; top: 0; left: 0; border-radius: 40px;" class="w-full h-full">
      <video #remoteVideo autoplay playsinline class="remote-video w-full h-full"></video>
    </div>
    <div style="position: absolute; z-index: 10; background-color: blue; width: 250px; height: 250px; top: 0; right: 0; margin-top: 20px; margin-right: 20px; border-radius: 40px;">
      <video #localVideo autoplay playsinline muted class="local-video"></video>
    </div>
    <div style="position: absolute; left: 35%; bottom: 10%;z-index: 15;" class="grid grid-nogutter gap-5">
      <p-button severity="contrast" (click)="updateVideo()">{{videoText}}</p-button>
      <p-button severity="primary" *ngIf="!isCallJoined" [disabled]="isCallJoined" (click)="startCall()">Join Call</p-button>
      <p-button severity="danger" *ngIf="isCallJoined" (click)="hangup()">Hang Up</p-button>
      <p-button severity="contrast" (click)="updateAudio()">{{audioText}}</p-button>
    </div>
  </div>
  <div class="col-4">
    <div class="grid grid-nogutter flex-column gap-5">
      
    </div>
  </div>
</div>
