
<div class="grid grid-nogutter p-4 md:p-8 lg:p-6 h-screen">
  <div
    class="col-12 md:col-12 lg:col-7 flex flex-column justify-content-between"
  >
    <div class="flex flex-column align-items-center lg:align-items-start">
      <img
        src="https://res.cloudinary.com/dyrbo1wml/image/upload/v1750841014/Logo_ofqiag.png"
        width="150"
        alt="Logo"
      />
    </div>
    <form
      [formGroup]="forgotPasswordForm"
      (ngSubmit)="onSubmit()"
      class="h-full flex flex-column justify-content-center align-items-center gap-2"
    >
      <div class="flex flex-column justify-content-center align-items-center">
        <h2 class="text-800 text-4xl font-semibold" style="margin: 0">
          Reset your Password
        </h2>
        <p class="text-700 text-base">
          Enter your email to continue.
        </p>
      </div>
      <div class="flex flex-column gap-3 col-12 md:col-8 lg:col-6">
        <small
          *ngIf="
            getFormControls['email'].touched && getFormControls['email'].invalid
          "
          class="p-error"
        >
          <p-message
            *ngIf="getFormControls['email'].errors?.['required']"
            severity="error"
            variant="simple"
            size="small"
            >Email is required</p-message
          >
          <p-message
            *ngIf="getFormControls['email'].errors?.['email']"
            severity="error"
            variant="simple"
            size="small"
            >Enter a valid email.</p-message
          >
        </small>
        <label for="email">Email</label>
        <input
          pInputText
          id="email"
          aria-describedby="email-help"
          formControlName="email"
        />
      </div>
      <div
        class="flex flex-column align-items-center gap-3 col-12 md:col-8 lg:col-6"
      >
        <p-button
          class="w-full"
          [disabled]="forgotPasswordForm.invalid"
          type="submit"
          label="Reset Password"
        />
        <p class="text-700 text-sm">
          Don't have an account yet?
          <a href="register" style="text-decoration: underline">Create an account</a>
        </p>
      </div>
    </form>
    <div>
      <p class="text-center text-sm text-600 mt-4">
        © 2025 Medicore. All rights reserved.
      </p>
      <a href="/"><p class="text-center text-sm text-600 mt-4" style="text-decoration: underline;">Privacy and Policy</p></a>
    </div>
  </div>
  <div class="col-12 md:col-12 lg:col-5 hidden lg:block md:block">
    <div
      class="h-full bg-primary"
      id="login-bg-img"
      style="border-radius: 20px; background-image: url('https://images.unsplash.com/photo-1591110849062-d54a6fe60847?q=80&w=735&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');background-repeat: no-repeat; background-size: cover;"
    ></div>
  </div>
</div>
