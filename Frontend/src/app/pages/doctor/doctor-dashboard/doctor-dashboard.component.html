<div>
  <div id="header" class="pb-7 grid grid-nogutter justify-between">
    <div class="col-12 md:col-6">
      <h2 class="text-800 text-primary-900 text-4xl font-semibold">
        Dashboard
      </h2>
    </div>
    <!-- <div class="col-12 md:col-6">
      <input placeholder="Search for doctors, appointments..." pInputText id="task-help" aria-describedby="task-help" />
    </div> -->
  </div>

  <p-tabs value="0">
    <p-tablist>
      <p-tab value="0">Overview</p-tab>
    </p-tablist>
    <p-tabpanels>
      <p-tabpanel value="0" class="col-12">

        <div class="grid mb-1">
          <!-- Card 01 -->
          <p-card class="col-12 md:col-4 h-15rem">
            <ng-template #title class="m-0"> Available Credits </ng-template>
            <ng-template #subtitle class="m-0">
              Expires at 31-Dec-2025</ng-template>
            <div class="flex flex-column gap-1 mt-4">
              <h2 class="text-primary-500 text-7xl font-bold" style="margin: 0">
                {{credits}} $
              </h2>
              <a href="/doctor/manageCredits" style="text-decoration: underline">Buy More Credits</a>
            </div>
          </p-card>

          <!-- Card 02 -->
          <p-card class="col-12 md:col-4 h-15rem">
            <ng-template #title class="m-0"> Total Appointments </ng-template>
            <ng-template #subtitle class="m-0"> Since 01-Jan-2025</ng-template>
            <div class="flex flex-column gap-1 mt-4">
              <h2 class="text-primary-500 text-7xl font-bold" style="margin: 0">
                {{totalAppointments}}
              </h2>
              <a href="/doctor/appointments" style="text-decoration: underline">View Schedule</a>
            </div>
          </p-card>
        </div>

        <div class="grid">
          <!-- Card 03 -->
          <p-card class="col-12 md:col-6">
            <ng-template #title class="m-0"> Upcoming Appointments </ng-template>
            <ng-template #subtitle class="m-0"> Most Recent Appointment</ng-template>
            <div class="flex flex-column gap-2 mt-4">
              <p-accordion>
                <div *ngFor="let data of doctorAppointments">
                  <p-fieldset legend="{{data.appointmentDate}} - {{convertTo12Hour(data.appointmentTime)}}">
                    <p class="m-0">
                      The appointment is set with {{data.patientName}}
                    </p>
                  </p-fieldset>
                </div>
              </p-accordion>
              <a href="/doctor/appointments" style="text-decoration: underline">View All Schedules</a>
            </div>
          </p-card>

        </div>
      </p-tabpanel>
    </p-tabpanels>
  </p-tabs>
</div>
